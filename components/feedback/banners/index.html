<main id="top">

<section class="fp-section fp-container" id="banner">
  <div class="fp-section__head">
    <span class="fp-kicker">08.1 — Announcement</span>
    <h2 class="fp-section__title">Banners &amp; Progress Notes</h2>
    <p class="fp-section__desc">The inverse banner strip across the top of a page, and an upload-style progress line.</p>
  </div>

  <div class="fp-stack fp-stack--loose">
    <div class="fp-banner">
      <span>FlatPlanet 1.0 is out — hard shadows for everyone.</span>
      <a href="#banner">Read the changelog</a>

    <div class="fp-panel fp-stack">
      <h3 class="fp-text-lg">Progress note</h3>
      <div class="fp-progress-note">
        <div class="fp-progress-note__head"><span>Uploading brand-kit.zip</span><span>72%</span></div>
        <div class="fp-progress"><div class="fp-progress__bar" style="width: 72%"></div></div>
      </div>
    </div>
  </div>
