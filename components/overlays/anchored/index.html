<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popovers & Context Menus — FlatPlanet</title>
<meta name="description" content="FlatPlanet is a hard-shadow, zero-gradient design system built on the BLP colour palette.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<link rel="stylesheet" href="../../../assets/css/base.css">
<link rel="stylesheet" href="../../../assets/css/elevation.css">
<link rel="stylesheet" href="../../../assets/css/components.css">
<link rel="stylesheet" href="../../../assets/css/components-2.css">
</head>
<body>

<p><a class="fp-btn fp-btn--ghost fp-btn--sm" href="../../../components/overlays/">&larr; Modals, Drawers & Disclosure</a> <a class="fp-btn fp-btn--ghost fp-btn--sm" href="../../../components/">Components</a></p>

<main id="top">

<section class="fp-section fp-container" id="anchored">
  <div class="fp-section__head">
    <span class="fp-kicker">10.2 — Anchored</span>
    <h2 class="fp-section__title">Popovers &amp; Context Menus</h2>
    <p class="fp-section__desc">The small anchored overlay and the right-click menu — both main elements with the one hard shadow.</p>
  </div>

  <div class="fp-grid fp-grid--2">
    <div class="fp-panel fp-stack">
      <h3 class="fp-text-lg">Popover</h3>
      <div class="fp-popover">
        <div class="fp-popover__title">Hard shadow</div>
        <p class="fp-text-sm fp-text-muted" style="margin: 0;">Every overlay is a main element: no border, one hard shadow.</p>
      </div>
    </div>

    <div class="fp-panel fp-stack">
      <h3 class="fp-text-lg">Context menu</h3>
      <div class="fp-context" role="menu">
        <button class="fp-context__item" role="menuitem">Rename</button>
        <button class="fp-context__item" role="menuitem">Duplicate</button>
        <div class="fp-context__sep"></div>
        <button class="fp-context__item fp-context__item--danger" role="menuitem">Delete</button>
      </div>
    </div>
  </div>

</section>

</main>
<script src="../../../assets/js/flatplanet.js"></script>
</body>
</html>
