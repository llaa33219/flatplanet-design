<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bottom Sheet — FlatPlanet</title>
<meta name="description" content="FlatPlanet is a hard-shadow, zero-gradient design system built on the BLP colour palette.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/tokens.css">
<link rel="stylesheet" href="../../../assets/css/base.css">
<link rel="stylesheet" href="../../../assets/css/elevation.css">
<link rel="stylesheet" href="../../../assets/css/components.css">
<link rel="stylesheet" href="../../../assets/css/components-2.css">
</head>
<body>

<p><a class="fp-btn fp-btn--ghost fp-btn--sm" href="../../../components/overlays/">&larr; Modals, Drawers & Disclosure</a> <a class="fp-btn fp-btn--ghost fp-btn--sm" href="../../../components/">Components</a></p>

<main id="top">

<section class="fp-section fp-container" id="sheet">
  <div class="fp-section__head">
    <span class="fp-kicker">10.1 — Mobile</span>
    <h2 class="fp-section__title">The Bottom Sheet</h2>
    <p class="fp-section__desc">A modal that owns the bottom edge of the screen — a main element with a hard shadow and no border, rounded only at the top corners.</p>
  </div>

  <div class="fp-row" style="align-items: flex-start; gap: var(--fp-space-8); flex-wrap: wrap;">
    <div class="fp-phone">
      <div class="fp-phone__body"></div>
      <div class="fp-sheet">
        <div class="fp-sheet__handle"></div>
        <h3 class="fp-text-lg" style="margin-bottom: var(--fp-space-2);">Share project</h3>
        <p class="fp-text-sm fp-text-muted" style="margin-bottom: var(--fp-space-4);">Anyone with the link can view this workspace.</p>
        <div class="fp-row fp-row--tight">
          <button class="fp-btn fp-btn--primary fp-btn--block">Copy link</button>
          <button class="fp-btn fp-btn--secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</section>

</main>
<script src="../../../assets/js/flatplanet.js"></script>
</body>
</html>
